[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asil"
version = "0.1.0"
description = "Agent-Software Interaction Layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "lxml>=5.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "websockets>=12.0",
    "playwright>=1.54",
]

[project.optional-dependencies]
obs = ["obs-websocket-py>=1.0"]
eval = ["openai>=1.0", "anthropic>=0.30", "httpx[socks]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/asil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
